{% extends "base.html" %}
{% load static %}

{% block title %}Create Exam | SchoolPro{% endblock %}

{% block extra_css %}

<link rel="stylesheet" href="{% static 'css/pages/core_exam_form.css' %}">
{% endblock %}

{% block content %}
<main class="wrap"><a href="{% url 'exam_list' %}">← Exams</a><div class="card"><h1>Create Exam</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label>Exam name</label><input name="name" required></div><div class="field"><label>Academic year</label><input name="academic_year" value="2026-2027" pattern="[0-9]{4}-[0-9]{4}" required></div><div class="field"><label>Class</label><input name="student_class" required></div><div class="field"><label>Exam date</label><input type="date" name="exam_date"></div><div class="field"><label>Maximum marks per subject</label><input type="number" name="max_marks" min="0.01" step="0.01" value="100" required></div><button class="btn">Create Exam</button></form></div></main>
{% endblock %}

{% block extra_js %}

{% endblock %}
