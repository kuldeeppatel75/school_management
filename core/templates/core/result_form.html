{% extends "base.html" %}
{% load static %}

{% block title %}Enter Result | SchoolPro{% endblock %}

{% block extra_css %}

<link rel="stylesheet" href="{% static 'css/pages/core_result_form.css' %}">
{% endblock %}

{% block content %}
<main class="wrap"><a href="{% url 'exam_list' %}">← Exams</a><div class="card"><h1>Enter Student Marks</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label>Exam</label><select name="exam" required><option value="">Select exam</option>{% for e in exams %}<option value="{{ e.pk }}">{{ e.name }} — Class {{ e.student_class }} (Max {{ e.max_marks }})</option>{% endfor %}</select></div><div class="field"><label>Student</label><select name="student" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.pk }}">{{ s.admission_number }} — {{ s.full_name }} (Class {{ s.student_class }})</option>{% endfor %}</select></div><div class="field"><label>Subject</label><input name="subject" required></div><div class="field"><label>Marks obtained</label><input type="number" name="marks_obtained" min="0" step="0.01" required></div><div class="field"><label>Remarks</label><input name="remarks"></div><button class="btn">Save Result</button></form></div></main>
{% endblock %}

{% block extra_js %}

{% endblock %}
